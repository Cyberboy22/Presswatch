# Reverse proxy in front of the PressWatch API.
upstream presswatch_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 2m;   # one cycle with all curves is ~20 kB
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        proxy_pass http://presswatch_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1h;
    }

    location / {
        proxy_pass http://presswatch_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
