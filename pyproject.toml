[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "presswatch"
version = "0.1.0"
description = "Qualitätsvorhersage und Drift-Überwachung für nicht-isothermes Glaspressen – die komplette Datenpipeline im Kleinen"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arif Onur Alp" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "asyncua>=1.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
reports = ["matplotlib>=3.8"]

[project.scripts]
presswatch = "presswatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
presswatch = ["web/static/*", "web/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: braucht eine PostgreSQL-Datenbank (PRESSWATCH_TEST_DATABASE_URL)",
    "integration: startet echte OPC-UA- und HTTP-Server",
]
filterwarnings = ["ignore::DeprecationWarning:asyncua.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
